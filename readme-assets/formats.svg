<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="Patch formats: IPS, BPS, UPS and PPF1/2/3 are applied; xdelta/VCDIFF is detected but not applied; APS, RUP, MOD, BDF and BSPATCH are recognized only">
<title>Patch formats: IPS, BPS, UPS and PPF1/2/3 are applied; xdelta/VCDIFF is detected but not applied; APS, RUP, MOD, BDF and BSPATCH are recognized only</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
<defs>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".03"/></pattern>
</defs>
<rect x="1" y="1" width="898" height="208" rx="16" fill="#0c1219" stroke="#223140" stroke-width="2"/>
