<rect x="1" y="1" width="898" height="338" rx="16" fill="#0c1219" stroke="#223140" stroke-width="2"/>
<rect x="1" y="1" width="898" height="338" rx="16" fill="url(#sc)"/>
<text x="40" y="44" font-size="12" fill="#7f93a8">WAKKA lab / patch bay</text>
<text x="40" y="98" font-size="48" font-weight="700" fill="#e6eef6">Retro Mod Pod</text>
<text class="hg" x="40" y="138" font-size="22" font-weight="700" fill="#ffa23d" filter="url(#gl)">Game in. Mod in. KABOOMY out.</text>
<text x="40" y="166" font-size="13" fill="#7f93a8">Feed it a game. Feed it a mod. Press the irresponsible button.</text>
