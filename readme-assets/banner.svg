<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Retro Mod Pod: a game goes into the Game Pod, a mod into the Mod Pod, the big red KABOOMY button produces a patched ZIP and receipt, and a mismatch produces NO KABOOMY instead">
<title>Retro Mod Pod: a game goes into the Game Pod, a mod into the Mod Pod, the big red KABOOMY button produces a patched ZIP and receipt, and a mismatch produces NO KABOOMY instead</title>
<style>
