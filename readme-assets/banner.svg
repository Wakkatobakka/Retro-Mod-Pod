<text x="176" y="216" font-size="19" font-weight="700" fill="#ffa23d">offline</text>
<text x="176" y="234" font-size="11" fill="#7f93a8">operation</text>
<rect x="284" y="188" width="112" height="56" rx="10" fill="#101a24" stroke="#223140" stroke-width="2"/>
